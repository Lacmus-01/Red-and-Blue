<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blue or Red? — Reveal on Jan 1, 2028</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #0a0a0a; color: #eee; margin: 0;
    padding: 24px 16px; text-align: center;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  h1 { font-size: 1.5rem; margin: 0 0 8px; }
  .sub { color: #888; font-size: .85rem; margin-bottom: 28px; line-height: 1.5; }
  .timer {
    display: flex; gap: 12px; margin-bottom: 32px;
    font-variant-numeric: tabular-nums;
  }
  .timer div {
    background: #1a1a1a; border-radius: 12px; padding: 10px 14px;
    min-width: 64px;
  }
  .timer span { display: block; font-size: 1.6rem; font-weight: 700; }
  .timer small { color: #777; font-size: .7rem; text-transform: uppercase; letter-spacing: 1px; }
  .buttons { display: flex; gap: 20px; margin-bottom: 32px; }
  
  button.choice {
    width: 42vw; max-width: 160px; aspect-ratio: 1;
    border-radius: 50%; border: none; color: #fff;
    font-size: 1.1rem; font-weight: 600; cursor: pointer;
    transition: all .2s;
    -webkit-tap-highlight-color: transparent;
  }
  button.choice:active:not(:disabled) { transform: scale(.95); }
  
  #blue { background: #2563eb; }
  #red { background: #dc2626; }
  
  /* Убираем стандартную прозрачность, чтобы цвета оставались яркими */
  button:disabled { cursor: not-allowed; opacity: 1; } 
  /* Стиль для выбранной кнопки (белая рамка) */
  .selected-btn { box-shadow: inset 0 0 0 5px #fff, 0 0 15px rgba(255,255,255,0.4); }
  
  .hidden { display: none !important; }
  .bar {
    height: 28px; background: #222; border-radius: 14px;
    overflow: hidden; display: flex; margin: 0 auto 20px;
    width: 100%; max-width: 460px;
  }
  #blueBar { background: #2563eb; width: 0%; transition: width .6s; }
  #redBar { background: #dc2626; width: 0%; transition: width .6s; }
  .counters {
    display: flex; gap: 32px; justify-content: center;
    font-size: 1.2rem; font-variant-numeric: tabular-nums;
  }
  .status { color: #777; font-size: .8rem; margin-top: 24px; }
</style>
</head>
<body>

  <h1 id="title">Which button will you press?</h1>
  <p class="sub" id="subtitle">
    Blue: if most press blue — everyone survives.<br>
    Red: if most press red — red survives.<br>
    Results revealed on Jan 1, 2028.
  </p>

  <!-- Таймер -->
  <div class="timer" id="timer">
    <div><span id="days">--</span><small>days</small></div>
    <div><span id="hours">--</span><small>hours</small></div>
    <div><span id="minutes">--</span><small>min</small></div>
    <div><span id="seconds">--</span><small>sec</small></div>
  </div>

  <!-- Кнопки -->
  <div class="buttons" id="voteUI">
    <button class="choice" id="blue">Blue</button>
    <button class="choice" id="red">Red</button>
  </div>

  <!-- Результаты -->
  <div id="resultsUI" class="hidden">
    <div class="bar">
      <div id="blueBar"></div>
      <div id="redBar"></div>
    </div>
    <div class="counters">
      <span>🔵 <span id="blueCount">0</span></span>
      <span>🔴 <span id="redCount">0</span></span>
    </div>
  </div>

  <p class="status" id="status"></p>

<script>
  // ====== ТВОИ КЛЮЧИ ======
  const SUPABASE_URL = 'https://awncrxqceeahorwkctof.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_F6rRlOAfdDvybRLs-pSJxw_UlGsufU7';
  // ========================

  // Дедлайн: 1 января 2028, 00:00:00 по московскому времени (UTC+3)
  const DEADLINE = new Date('2028-01-01T00:00:00+03:00').getTime();

  const $ = id => document.getElementById(id);

  // Проверка: если человек уже голосовал ранее (при загрузке страницы)
  const savedVote = localStorage.getItem('voted');
  if (savedVote) {
    const selectedBtn = $(savedVote);
    const otherBtn = $(savedVote === 'blue' ? 'red' : 'blue');
    
    // Выбранная остается своего цвета, но получает рамку и текст
    selectedBtn.classList.add('selected-btn');
    selectedBtn.textContent = 'Selected';
    selectedBtn.disabled = true;
    
    // Вторая становится серой
    otherBtn.style.backgroundColor = '#4b5563'; 
    otherBtn.disabled = true;
    
    $('status').textContent = 'You already voted.';
  }

  // ----- Таймер -----
  function tick() {
    const now = Date.now();
    const diff = DEADLINE - now;

    if (diff <= 0) {
      $('timer').classList.add('hidden');
      $('voteUI').classList.add('hidden');
      $('subtitle').classList.add('hidden');
      $('title').textContent = 'Results';
      $('resultsUI').classList.remove('hidden');
      $('status').classList.add('hidden');
      loadResults();
      clearInterval(timerId);
      return;
    }

    const d = Math.floor(diff / 86400000);
    const h = Math.floor(diff % 86400000 / 3600000);
    const m = Math.floor(diff % 3600000 / 60000);
    const s = Math.floor(diff % 60000 / 1000);
    $('days').textContent = d;
    $('hours').textContent = String(h).padStart(2, '0');
    $('minutes').textContent = String(m).padStart(2, '0');
    $('seconds').textContent = String(s).padStart(2, '0');
  }
  const timerId = setInterval(tick, 1000);
  tick();

  // ----- Голосование (через Edge Function с проверкой IP) -----
  async function vote(color) {
    if (localStorage.getItem('voted')) return;

    const selectedBtn = $(color);
    const otherBtn = $(color === 'blue' ? 'red' : 'blue');

    // 1. Мгновенная визуальная фиксация
    // Выбранная кнопка: остается того же цвета, но получает белую рамку и текст Selected
    selectedBtn.classList.add('selected-btn');
    selectedBtn.textContent = 'Selected';
    selectedBtn.disabled = true;
    
    // Вторая кнопка: становится серой
    otherBtn.style.backgroundColor = '#4b5563'; 
    otherBtn.disabled = true;

    try {
      // 2. Отправляем запрос на сервер Supabase (Edge Function)
      const res = await fetch(SUPABASE_URL + '/functions/v1/hyper-task', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ color: color })
      });

      const data = await res.json();

      if (!res.ok) {
        // Если IP уже голосовал (ошибка 403)
        if (res.status === 403) {
          localStorage.setItem('voted', color);
          $('status').textContent = 'Error: You already voted from this IP.';
          return;
        }
        throw new Error(data.error || 'Server error');
      }

      // 3. Успех!
      localStorage.setItem('voted', color);
      $('status').textContent = 'Your vote has been saved.';
      if (navigator.vibrate) navigator.vibrate(30);

    } catch (e) {
      // Если ошибка сети, возвращаем кнопки обратно в исходное состояние
      $('status').textContent = 'Error: ' + e.message;
      
      // Убираем рамку и текст, включаем обратно
      selectedBtn.classList.remove('selected-btn');
      selectedBtn.textContent = color === 'blue' ? 'Blue' : 'Red';
      selectedBtn.disabled = false;
      
      // Возвращаем второй кнопке её цвет
      otherBtn.style.backgroundColor = color === 'blue' ? '#dc2626' : '#2563eb';
      otherBtn.disabled = false;
      localStorage.removeItem('voted');
    }
  }

  $('blue').onclick = () => vote('blue');
  $('red').onclick = () => vote('red');

  // ----- Результаты (работает после дедлайна) -----
  async function loadResults() {
    try {
      const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_results', {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'Content-Type': 'application/json'
        },
        body: '{}'
      });
      
      const data = await res.json();
      const r = data[0];
      
      const total = (r.blue + r.red) || 1;
      $('blueCount').textContent = r.blue;
      $('redCount').textContent = r.red;
      $('blueBar').style.width = (r.blue / total * 100) + '%';
      $('redBar').style.width = (r.red / total * 100) + '%';
    } catch (e) {
      $('status').textContent = 'Error loading results: ' + e.message;
      $('status').classList.remove('hidden');
    }
  }
</script>
</body>
</html>
